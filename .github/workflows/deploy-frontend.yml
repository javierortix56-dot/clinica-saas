name: Deploy Frontend to Vercel

# Se dispara cuando el workflow CI termina EN VERDE sobre main: el deploy queda
# gateado por typecheck + tests + build (antes deployaba en cada push sin checks).
# Nota: workflow_run no soporta filtro por paths; un push que no toca frontend
# también deploya — Vercel resuelve rápido builds sin cambios.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        working-directory: .
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

# ---------------------------------------------------------------------------
# Variables de entorno a configurar en el dashboard de Vercel
# (Settings → Environment Variables → Production):
#
#   NEXT_PUBLIC_SUPABASE_URL       URL del proyecto Supabase
#   NEXT_PUBLIC_SUPABASE_ANON_KEY  Clave anon pública de Supabase
#   NEXT_PUBLIC_API_URL            URL del backend NestJS (ej. https://api.tudominio.com)
#
# Secrets de GitHub requeridos (Settings → Secrets → Actions):
#   VERCEL_TOKEN       Token de API de Vercel (vercel.com/account/tokens)
#   VERCEL_ORG_ID      ID del equipo/organización en Vercel
#   VERCEL_PROJECT_ID  ID del proyecto en Vercel
# ---------------------------------------------------------------------------
